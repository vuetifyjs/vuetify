packages:
  - packages/*

autoInstallPeers: false

catalog:
  # Vue ecosystem
  vue: '^3.5.25'
  vue-router: '^4.6.3'
  vue-i18n: '^11.1.12'
  vue-tsc: '^3.2.6'
  '@vue/compiler-dom': '^3.5.25'
  '@vue/compiler-sfc': '^3.5.25'
  '@vue/reactivity': '^3.5.25'
  '@vue/runtime-core': '^3.5.25'
  '@vue/runtime-dom': '^3.5.25'
  '@vue/shared': '^3.5.25'
  '@vue/test-utils': '^2.4.6'
  '@vuetify/babel-plugin-jsx': '^1.7.0'

  # Build tools
  vite: '^7.3.6'
  '@vitejs/plugin-vue': '^6.0.2'
  '@vitejs/plugin-vue-jsx': '^5.1.2'
  '@vitejs/plugin-basic-ssl': '^2.1.0'
  vitest: '^4.1.11'
  '@vitest/browser-playwright': '^4.1.11'
  '@vitest/coverage-istanbul': '^4.1.11'
  '@vitest/ui': '^4.1.11'
  vite-plugin-vuetify: '^2.1.2'
  vite-plugin-md: '^0.22.5'
  vite-plugin-pages: '^0.33.0'
  vite-plugin-pwa: '^1.3.0'
  vite-plugin-vue-layouts: '^0.11.0'
  vite-plugin-inspect: 11.3.3
  vite-ssr: '^0.17.2'
  vite-live-preview: '^0.4.0'
  unplugin-auto-import: 19.3.0
  unplugin-vue-components: '^0.28.0'
  unplugin-fonts: 1.4.0
  '@rollup/plugin-alias': '^5.1.1'
  '@rollup/plugin-babel': '^6.1.0'
  '@rollup/plugin-node-resolve': '^16.0.3'
  '@rollup/plugin-typescript': '^12.3.0'
  rollup: '^4.53.3'
  rollup-plugin-dts: '^6.4.1'
  rollup-plugin-sass: '^1.15.3'
  rollup-plugin-sourcemaps: '^0.6.3'
  '@rollup/plugin-terser': '^0.4.4'

  # Babel ecosystem
  '@babel/cli': '^7.28.3'
  '@babel/core': '^7.28.5'
  '@babel/preset-env': '^7.28.5'
  '@babel/preset-typescript': '^7.28.5'
  '@babel/generator': '^7.28.5'
  '@babel/types': '^7.28.5'
  babel-plugin-add-import-extension: 1.5.1
  babel-plugin-module-resolver: '^5.0.2'
  babel-plugin-transform-define: '^2.1.4'
  babel-polyfill: '^6.26.0'

  # TypeScript tools
  typescript: '~6.0.2'
  '@typescript/native-preview': 7.0.0-dev.20260323.1
  ts-node: '^10.9.2'
  ts-morph: '^25.0.1'
  '@types/node': 24.10.1
  '@types/lodash-es': '^4.17.12'
  '@types/stringify-object': '^4.0.5'
  '@types/prismjs': '^1.26.5'
  '@types/markdown-it': '^14.1.2'
  '@types/markdown-it-container': '^2.0.10'
  '@types/babel__generator': '^7.27.0'
  '@types/yargs': '^17.0.35'
  '@typescript-eslint/eslint-plugin': '^8.57.2'
  '@typescript-eslint/parser': '^8.57.2'

  # CSS/Styling
  sass: 1.93.3
  sass-embedded: 1.93.3
  postcss: '^8.5.3'
  autoprefixer: '^10.4.22'
  cssnano: '^7.1.2'
  csstype: '^3.2.3'

  # UI and icons
  '@mdi/font': 7.4.47
  '@mdi/js': 7.4.47
  '@mdi/svg': 7.4.47
  roboto-fontface: '^0.10.0'
  '@fortawesome/fontawesome-svg-core': '^6.7.2'
  '@fortawesome/free-solid-svg-icons': '^6.7.2'
  '@fortawesome/vue-fontawesome': '^3.0.8'

  # Utils and helpers
  lodash-es: '^4.17.21'
  upath: '^2.0.1'
  semver: '^7.7.3'
  rimraf: '^6.1.2'
  mkdirp: '^3.0.1'
  shelljs: '^0.10.0'
  moment: '^2.30.1'
  date-fns: '^3.6.0'
  dayjs: '^1.11.19'
  luxon: '^3.7.2'
  dotenv: '^16.5.0'
  cross-spawn: '^7.0.6'
  stringify-object: '^5.0.0'
  fast-glob: '^3.3.3'
  micromatch: '^4.0.8'
  acorn-walk: '^8.3.4'
  prettier: '^3.6.2'
  deepmerge: '^4.3.1'
  glob: '^11.1.0'
  magic-string: '^0.30.21'

  # ESLint ecosystem
  eslint: '^8.57.0'
  eslint-config-standard: '^17.1.0'
  eslint-formatter-codeframe: '^7.32.2'
  eslint-plugin-import: '^2.32.0'
  eslint-plugin-local-rules: '^2.0.1'
  eslint-plugin-n: '^16.6.2'
  eslint-plugin-promise: '^6.6.0'
  eslint-plugin-react: '^7.37.5'
  eslint-plugin-sonarjs: '^0.25.1'
  eslint-plugin-vue: '^10.6.0'
  eslint-plugin-vuetify: '^2.5.3'
  '@vitest/eslint-plugin': '^1.6.27'
  '@stylistic/eslint-plugin-ts': '^3.1.0'
  vue-eslint-parser: '^10.2.0'

  # Testing
  jest: '^30.2.0'
  jest-runner-eslint: '^2.3.0'
  jest-silent-reporter: '^0.6.0'
  jsdom: '^27.2.0'
  expect: '^30.2.0'
  identity-obj-proxy: '^3.0.0'
  '@testing-library/user-event': '^14.6.1'
  '@testing-library/vue': '^8.1.0'
  timezone-mock: '^1.3.6'
  playwright: '^1.62.1'
  '@vizzly-testing/cli': '^0.22.2'
  '@vizzly-testing/vitest': '^0.1.1'

  # Documentation
  markdownlint-cli: '^0.46.0'
  markdown-it: '^14.1.1'
  markdown-it-anchor: '^9.2.0'
  markdown-it-attrs: '^4.3.1'
  markdown-it-container: '^4.0.0'
  markdown-it-emoji: '^2.0.2'
  markdown-it-header-sections: '^1.0.0'
  markdown-it-link-attributes: '^4.0.1'
  markdown-it-multimd-table: '^4.2.3'
  markdown-it-prism: '^3.0.1'
  prismjs: '^1.30.0'
  prism-theme-vars: '^0.2.5'
  front-matter: '^4.0.2'
  '@resvg/resvg-js': '^2.6.2'
  satori: '^0.26.0'

  # Other dependencies
  '@lerna-lite/cli': '^4.9.3'
  '@lerna-lite/version': '^4.9.3'
  concurrently: '^9.2.1'
  piscina: '^4.9.2'
  conventional-changelog-cli: '^5.0.0'
  conventional-changelog-vuetify: '^2.0.2'
  '@vuetify/github-releaser': '^4.0.3'
  husky: '^9.1.7'
  inquirer: '^12.6.0'
  pinia: '^3.0.4'
  vee-validate: '^4.15.1'
  yargs: '^17.7.2'
  '@vuetify/one': '^4.0.0'
  '@unhead/vue': '^2.0.19'
  '@vueuse/head': '^1.3.1'
  '@octokit/core': '^6.1.5'
  '@cosmicjs/sdk': '^1.5.6'
  '@sentry/vue': '^9.12.0'
  '@vuelidate/core': '^2.0.3'
  '@vuelidate/validators': '^2.0.4'
  '@intlify/unplugin-vue-i18n': '^11.0.1'
  '@intlify/devtools-types': '^11.1.12'
  swetrix: '^3.7.2'
  vue-instantsearch: '^4.20.6'
  algoliasearch: '^4.24.0'
  algoliasearch-helper: '^3.26.1'
  '@yankeeinlondon/builder-api': '^1.4.1'
  ajv: '^8.17.1'
  async-es: '^3.2.6'
  '@emailjs/browser': '^4.4.1'
  fflate: '^0.8.2'
  isomorphic-fetch: '^3.0.0'
  '@vue/language-server': '^3.1.5'
  '@date-io/core': 3.2.0
  '@date-io/date-fns': 3.2.1
  '@date-io/dayjs': '^3.2.0'
  '@date-io/luxon': '^3.2.0'
  '@date-io/moment': '^3.2.0'
  cy-mobile-commands: '^0.3.0'
  '@octokit/openapi-types': '^25.0.0'
  '@testing-library/dom': 'npm:@vuetify/testing-library-dom@1.0.3'

ignoreWorkspaceRootCheck: true

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - edgedriver
  - geckodriver
  - unrs-resolver
  - vue-demi

linkWorkspacePackages: deep

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - '@vuetify/one'
  - '@vuetify/testing-library-dom'
  - '@vuetify/v0'
  - playwright
  - playwright-core
  - vitest@4.1.11
  - '@vizzly-testing/vitest@0.1.1'

nodeLinker: hoisted

overrides:
  '@testing-library/dom': npm:@vuetify/testing-library-dom@1.0.3
  '@types/node': 'catalog:'
  '@vue/babel-plugin-jsx': npm:@vuetify/babel-plugin-jsx@1.6.0
  brilliant-errors>bumpp: '-'
  brilliant-errors>vitest: '-'
  vite-ssr>react-router-dom: '-'
  vite-ssr>react-ssr-prepass: '-'

patchedDependencies:
  '@mdi/js@7.4.47': patches/@mdi__js@7.4.47.patch
  '@testing-library/vue': patches/@testing-library__vue.patch
  '@typescript-eslint/typescript-estree@8.57.2': patches/@typescript-eslint__typescript-estree@8.57.2.patch
  playwright-core: patches/playwright-core.patch

peerDependencyRules:
  allowedVersions:
    '@sentry/vue>pinia': '*'
    '@testing-library/user-event>@testing-library/dom': '*'
    '@vitejs/plugin-vue': '*'
    '@vueuse/head': '*'
    rollup: '*'
    vite: '*'

shellEmulator: true

updateConfig:
  ignoreDependencies:
    - babel-plugin-add-import-extension
